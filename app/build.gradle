plugins {
    alias(libs.plugins.android.application)
}

// Release signing: keystore.properties is NOT committed to git.
// Create app/keystore.properties (see app/keystore.properties.example) before doing a release build.
def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.dweenmd.womensafety'
    compileSdk 35

    defaultConfig {
        applicationId "com.dweenmd.womensafety"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Falls back to debug signing if no keystore.properties is set up yet,
            // so the project still builds out of the box. Set up keystore.properties
            // before shipping a real release build.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Note: @aar is required for this specific library to resolve correctly from JitPack
    implementation 'com.github.tbouron.shakedetector:library:1.0.0@aar'
    implementation libs.play.services.maps
    implementation libs.play.services.location
}
